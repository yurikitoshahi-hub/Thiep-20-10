<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Điện Tử 20/10 - Tôn Vinh Phụ Nữ Việt Nam</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Thư viện chụp ảnh thiệp -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #e91e63;
            --primary-light: #f8bbd0;
            --secondary: #ad1457;
            --accent: #ff80ab;
            --bg-gradient: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #4a154b;
            --text-sub: #880e4f;
            --shadow: 0 10px 30px rgba(233, 30, 99, 0.15);
        }

        /* Giao diện 2: Hoa Hồng Gold */
        body.theme-gold {
            --primary: #d4af37;
            --primary-light: #f3e5ab;
            --secondary: #8c7853;
            --accent: #ffd700;
            --bg-gradient: linear-gradient(135deg, #fffdf0 0%, #fdf5c9 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #3d3522;
            --text-sub: #6b5b37;
            --shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        /* Giao diện 3: Tím Lavender */
        body.theme-lavender {
            --primary: #8e44ad;
            --primary-light: #d7bde2;
            --secondary: #512e5f;
            --accent: #bb8fce;
            --bg-gradient: linear-gradient(135deg, #f4ecf7 0%, #ebdef0 100%);
            --card-bg: rgba(255, 255, 255, 0.88);
            --text-main: #4a235a;
            --text-sub: #512e5f;
            --shadow: 0 10px 30px rgba(142, 68, 173, 0.15);
        }

        /* Giao diện 4: Xanh Mint */
        body.theme-mint {
            --primary: #00b09b;
            --primary-light: #a3e4d7;
            --secondary: #0e6251;
            --accent: #48c9b0;
            --bg-gradient: linear-gradient(135deg, #e8f8f5 0%, #d1f2eb 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #0b5345;
            --text-sub: #0e6251;
            --shadow: 0 10px 30px rgba(0, 176, 155, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: background 0.5s ease;
        }

        /* Canvas hiệu ứng nền */
        #fxCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        /* Header & Audio Widget */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.6);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-title .icon-20 {
            width: 40px;
            height: 40px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .logo-title h1 {
            font-size: 1.1rem;
            font-family: 'Playfair Display', serif;
            color: var(--secondary);
        }

        .logo-title p {
            font-size: 0.75rem;
            color: #666;
        }

        .audio-player-widget {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.6);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--primary-light);
        }

        .audio-player-widget select {
            border: none;
            background: transparent;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
        }

        .music-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .music-btn:hover {
            transform: scale(1.1);
        }

        /* Studio Panel Form */
        .studio-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.7);
            margin-bottom: 30px;
        }

        .section-tag {
            text-align: center;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--secondary);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .studio-card h2 {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--secondary);
            margin-bottom: 8px;
        }

        .studio-desc {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media(max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--primary-light);
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.9);
            color: var(--text-main);
            transition: 0.3s;
            outline: none;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(233, 30, 99, 0.1);
        }

        /* Chọn màu theme */
        .theme-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .theme-btn {
            flex: 1;
            min-width: 100px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .theme-btn.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--secondary);
            font-weight: 600;
        }

        .theme-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        /* Chọn kiểu thiệp */
        .template-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        @media(max-width: 768px) {
            .template-selector { grid-template-columns: repeat(2, 1fr); }
        }

        .template-opt {
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            transition: 0.3s;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .template-opt i {
            font-size: 1.4rem;
            margin-bottom: 5px;
            display: block;
            color: var(--primary);
        }

        .template-opt.active {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--secondary);
            font-weight: 600;
        }

        /* Lời chúc mẫu */
        .preset-wishes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .preset-chip {
            background: rgba(233, 30, 99, 0.08);
            border: 1px solid var(--primary-light);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-sub);
            font-weight: 500;
        }

        .preset-chip:hover {
            background: var(--primary);
            color: #fff;
        }

        /* Upload ảnh kỷ niệm */
        .file-upload-box {
            border: 2px dashed var(--primary);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            position: relative;
            transition: 0.3s;
        }
        .file-upload-box:hover {
            background: rgba(255,255,255,0.8);
        }
        .file-upload-box input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-thumbnails {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .thumb-item {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--primary);
            position: relative;
        }

        /* Nút tạo thiệp */
        .btn-action {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.3);
            transition: 0.3s;
            text-align: center;
            margin-top: 15px;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(233, 30, 99, 0.4);
        }

        /* KHU VỰC HIỂN THỊ THIỆP ĐIỆN TỬ */
        .card-stage {
            display: none;
            margin-top: 40px;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-wrapper {
            background: #fff;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(0,0,0,0.05);
            max-width: 750px;
            margin: 0 auto;
        }

        /* Style 1: Thư Tay Cổ Điển */
        .card-style-1 .card-inner-box {
            padding: 50px 40px;
            background: linear-gradient(to bottom, #fff, #fff9fb);
            text-align: center;
            position: relative;
        }
        .envelope-flap {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Style 2: Bưu Thiệp Hiện Đại */
        .card-style-2 .card-inner-box {
            padding: 40px;
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Style 3: Thiệp Tối Giản */
        .card-style-3 .card-inner-box {
            padding: 50px;
            background: #fff;
            border: 8px solid var(--primary-light);
            text-align: center;
        }

        /* Style 4: Cuốn Sách Kỷ Niệm */
        .card-style-4 .card-inner-box {
            padding: 45px;
            background: #fffaf0;
            border-left: 12px solid var(--primary);
            text-align: left;
        }

        .card-to {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--secondary);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .card-recipient-name {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem;
            color: var(--primary);
            margin-bottom: 25px;
            line-height: 1.1;
        }

        /* Slider ảnh kỷ niệm trong thiệp */
        .card-gallery-container {
            width: 100%;
            max-width: 400px;
            height: 260px;
            margin: 0 auto 25px auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            position: relative;
            background: #eee;
        }
        .card-gallery-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            animation: fadeImg 0.5s ease-in-out;
        }
        .card-gallery-container img.active {
            display: block;
        }
        @keyframes fadeImg {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        .card-message-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #444;
            margin-bottom: 30px;
            white-space: pre-line;
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }

        .card-sender-signature {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: var(--secondary);
            font-weight: 700;
        }

        /* Action Toolbar sau khi tạo thiệp */
        .card-toolbar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn-tool {
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .btn-edit { background: #fff; color: var(--text-main); border: 2px solid #ddd; }
        .btn-share { background: #25d366; color: white; }
        .btn-download { background: var(--primary); color: white; }
        .btn-tool:hover { transform: translateY(-2px); }

        /* Modal Chia sẻ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            animation: scaleIn 0.3s ease;
        }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-content h3 {
            font-family: 'Playfair Display', serif;
            color: var(--secondary);
            margin-bottom: 15px;
        }
        .share-link-box {
            display: flex;
            gap: 8px;
            margin: 20px 0;
        }
        .share-link-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.85rem;
            background: #f9f9f9;
        }
        .btn-copy {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .modal-close {
            background: #eee;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            margin-top: 10px;
        }

        /* Tên tác giả cố định ở góc dưới */
        .author-watermark {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 0.8rem;
            color: rgba(0, 0, 0, 0.4);
            font-weight: 600;
            z-index: 999;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 10px;
            border-radius: 20px;
        }
    </style>
</head>
<body class="theme-pink">

    <!-- Canvas hiệu ứng trái tim & hoa rơi -->
    <canvas id="fxCanvas"></canvas>

    <!-- Tên tác giả ở góc dưới -->
    <div class="author-watermark">Tác giả: Nguyễn Thế Vinh</div>

    <div class="container">
        <!-- HEADER & ÂM NHẠC -->
        <header>
            <div class="logo-title">
                <div class="icon-20">20</div>
                <div>
                    <h1>Tháng 10</h1>
                    <p>Phụ Nữ Việt Nam</p>
                </div>
            </div>
            <div class="audio-player-widget">
                <select id="bgMusicSelect" onchange="changeMusicPreset()">
                    <option value="soft">🎹 Giai điệu Nhẹ Nhàng</option>
                    <option value="sweet">🎶 Khúc Ca Ngọt Ngào</option>
                    <option value="lullaby">🎵 Ru Êm Ám</option>
                    <option value="none">🔇 Tắt Nhạc</option>
                </select>
                <button class="music-btn" id="musicToggleBtn" onclick="toggleAudio()"><i class="fas fa-play"></i></button>
            </div>
        </header>

        <!-- STUDIO THIẾT KẾ THIỆP -->
        <div class="studio-card" id="studioSection">
            <div class="section-tag">Studio Thiết Kế Thiệp 20/10</div>
